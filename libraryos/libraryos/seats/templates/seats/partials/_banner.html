<!-- ROLE USER PROFILE BANNER -->
  <div class="bg-gradient-to-r from-navy-900 via-navy-800 to-royal-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-3">
        <div id="user-avatar" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 flex items-center justify-center font-bold text-sky-300">
          {{ current_user.avatar }}
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h2 id="user-name" class="font-semibold text-sm sm:text-base">{{ current_user.name }}</h2>
            <span id="user-role-badge" class="bg-blue-500/30 text-sky-200 border border-sky-300/30 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">{{ current_user.roleText }}</span>
          </div>
          <p id="user-subtitle" class="text-xs text-sky-100/80">{{ current_user.sub }}</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-xs bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 backdrop-blur-sm">
        <i class="fa-regular fa-calendar-check text-sky-300"></i>
        <span id="current-date-display">Tuesday, Oct 17, 2026</span>
        <span class="text-sky-300/50">|</span>
        <span id="current-time-display" class="font-mono font-medium">13:06:00</span>
      </div>
    </div>
  </div>
