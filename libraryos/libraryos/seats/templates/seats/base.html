{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}LibSAAS - Library Seat Availability and Analytics System{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'seats/js/tailwind-config.js' %}"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'seats/css/styles.css' %}">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
{% block content %}{% endblock %}
<script src="{% static 'seats/js/password-toggle.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
