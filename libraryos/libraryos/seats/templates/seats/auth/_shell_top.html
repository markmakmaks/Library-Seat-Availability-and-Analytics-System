<div class="bg-gradient-to-r from-navy-900 via-navy-800 to-royal-700 text-white">
  <div class="max-w-5xl mx-auto px-4 py-5 flex items-center space-x-3">
    <div class="bg-white/10 p-2.5 rounded-xl border border-white/20"><i class="fa-solid fa-book-open-reader text-lg"></i></div>
    <div>
      <div class="font-bold text-lg tracking-tight">LibSAAS</div>
      <div class="text-xs text-sky-100/80">Library Seat Availability and Analytics System</div>
    </div>
  </div>
</div>
{% if messages %}
  <div class="max-w-5xl w-full mx-auto px-4 mt-4 space-y-2">
    {% for m in messages %}
      <div class="p-3 rounded-lg text-sm border {% if m.tags == 'error' %}bg-rose-50 border-rose-200 text-rose-800{% else %}bg-emerald-50 border-emerald-200 text-emerald-800{% endif %}">{{ m }}</div>
    {% endfor %}
  </div>
{% endif %}
