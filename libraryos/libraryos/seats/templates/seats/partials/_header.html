<!-- TOP HEADER / NAV BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-navy-800 to-royal-600 text-white p-2.5 rounded-xl shadow-md">
          <i class="fa-solid fa-book-open-reader text-lg"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-bold text-lg text-navy-900 tracking-tight">LibraryOS</span>
            <span class="bg-sky-100 text-sky-800 text-xs font-semibold px-2 py-0.5 rounded-full border border-sky-200">v2.4 Live</span>
          </div>
          <p class="text-xs text-slate-500 hidden sm:block">Smart Seat Monitoring & Allocation System</p>
        </div>
      </div>

      <!-- Live Status & Global Occupancy -->
      <div class="hidden md:flex items-center space-x-4 bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200">
        <div class="flex items-center space-x-1.5">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-slate-700">Live Sync</span>
        </div>
        <div class="h-3 w-px bg-slate-300"></div>
        <div>
          <span class="text-slate-500">Available:</span>
          <span id="global-available-count" class="font-bold text-emerald-600 ml-1">{{ kpis.available }}</span>
          <span class="text-slate-400">/<span id="global-total-count">{{ kpis.total }}</span></span>
        </div>
      </div>

      <!-- Role Switcher Control -->
      <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-inner">
        <span class="text-xs font-semibold text-slate-500 px-2 hidden lg:inline">Role View:</span>
        <button onclick="switchRole('admin')" id="role-btn-admin" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-user-shield"></i>
          <span>Admin</span>
        </button>
        <button onclick="switchRole('professor')" id="role-btn-professor" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-user-tie"></i>
          <span>Professor</span>
        </button>
        <button onclick="switchRole('student')" id="role-btn-student" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-user-graduate"></i>
          <span>Student</span>
        </button>
      </div>
    </div>
  </header>
