<!-- Notification bell: unread badge + dropdown, filled by renderNotifications() in app.js -->
<div id="notif-wrap" class="relative">
  <button type="button" onclick="toggleNotifications(event)" aria-label="Notifications"
          class="relative bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg border border-white/10 font-semibold">
    <i class="fa-solid fa-bell"></i>
    <span id="notif-badge" class="hidden absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
  </button>
  <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 max-w-[90vw] bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 z-40 overflow-hidden">
    <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between">
      <span class="font-bold text-sm text-navy-900">Notifications</span>
      <button type="button" onclick="markNotificationsRead()" class="text-[11px] font-semibold text-royal-600 hover:underline">Mark all as read</button>
    </div>
    <div id="notif-list" class="max-h-96 overflow-y-auto divide-y divide-slate-100 custom-scrollbar"></div>
  </div>
</div>
